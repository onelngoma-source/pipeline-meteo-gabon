version: 2

models:
  - name: stg_meteo_quotidienne
    description: Météo quotidienne nettoyée, une ligne par ville et par jour.
    columns:
      - name: ville
        data_tests:
          - not_null
      - name: province
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: ["previsions", "archive"]